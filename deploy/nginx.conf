worker_processes auto;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  server_tokens off;
  log_format preview '$remote_addr $request_method $uri $status';
  access_log /var/log/nginx/access.log preview;
  client_max_body_size 4k;
  client_body_timeout 10s;
  limit_req_zone $binary_remote_addr zone=preview_login:10m rate=5r/m;
  limit_req_status 429;
  upstream triskel_app { server app:3000; }

  server {
    listen 80;
    server_name triskelfolk.es;
    return 308 https://triskelfolk.es$request_uri;
  }

  server {
    listen 443 ssl;
    server_name triskelfolk.es;
    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control "private, no-store, max-age=0" always;

    location = /_preview_auth {
      internal;
      proxy_pass http://triskel_app/api/preview/session;
      proxy_method GET;
      proxy_pass_request_body off;
      include /etc/nginx/proxy-headers.conf;
      proxy_set_header Content-Length "";
      proxy_set_header Cookie $http_cookie;
    }

    location = /api/preview/session {
      limit_req zone=preview_login burst=3 nodelay;
      include /etc/nginx/proxy-headers.conf;
      proxy_pass http://triskel_app;
    }

    location = /construccion {
      include /etc/nginx/proxy-headers.conf;
      proxy_pass http://triskel_app;
    }
    location = /brand/triskel-simbolo.png {
      include /etc/nginx/proxy-headers.conf;
      proxy_pass http://triskel_app;
    }
    # Next validates the exact public symbol via localPatterns; private sources are rejected.
    location = /_next/image {
      include /etc/nginx/proxy-headers.conf;
      proxy_pass http://triskel_app;
    }
    location = /robots.txt {
      include /etc/nginx/proxy-headers.conf;
      proxy_pass http://triskel_app;
    }
    # Draft legal documents remain 404; only the server's approved registry can publish them.
    location ~ ^/(aviso-legal|privacidad|cookies)$ {
      include /etc/nginx/proxy-headers.conf;
      proxy_pass http://triskel_app;
    }
    location ~ ^/_next/static/.*\.map$ { return 404; }
    location /_next/static/ {
      include /etc/nginx/proxy-headers.conf;
      proxy_pass http://triskel_app;
    }

    location /api/ {
      auth_request /_preview_auth;
      include /etc/nginx/proxy-headers.conf;
      proxy_pass http://triskel_app;
    }
    location / {
      auth_request /_preview_auth;
      error_page 401 =302 /construccion;
      include /etc/nginx/proxy-headers.conf;
      proxy_pass http://triskel_app;
    }
  }
}
