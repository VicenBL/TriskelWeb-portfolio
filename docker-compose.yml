services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: triskelweb
      POSTGRES_USER: triskel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a private database password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [database]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U triskel -d triskelweb"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      APP_BASE_URL: https://triskelfolk.es
      DATABASE_URL: ${DATABASE_URL:?Set a private PostgreSQL connection URL}
      PREVIEW_ACCESS_MODE: protected
      PREVIEW_ORIGIN: https://triskelfolk.es
      PREVIEW_PASSWORD_HASH: ${PREVIEW_PASSWORD_HASH:?Generate the private preview hash}
      PREVIEW_SESSION_SECRET: ${PREVIEW_SESSION_SECRET:?Generate an independent preview secret}
    networks: [frontend, database]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/construccion').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3

  proxy:
    image: nginx:1.28-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/proxy-headers.conf:/etc/nginx/proxy-headers.conf:ro
      - ${TRISKEL_TLS_DIRECTORY:?Set the private TLS certificate directory}:/etc/nginx/tls:ro
    networks: [frontend]

networks:
  frontend:
  database:
    internal: true

volumes:
  postgres-data:
